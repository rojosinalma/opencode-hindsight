name: Feature request
description: Propose a change or an addition
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the plugin does not let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? A new option, a change to recall or retain, a tool, a log line…
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Recall (per-prompt injection)
        - Retain (end of turn / compaction)
        - Tools (hindsight_recall / reflect / retain)
        - Project key / bank naming
        - Options and environment
        - Logging and debugging
        - Other
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: The change keeps every network call bounded by a timeout and never blocks a turn.
        - label: I searched existing issues.
